name: Python checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types and tests
    # The locked ARM wheels avoid installing the x86-only CUDA dependency chain.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      POETRY_NO_INTERACTION: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Install pinned Poetry in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/poetry"
          # Match the Docker build and the checked-in Poetry 2.0 lock format.
          "$RUNNER_TEMP/poetry/bin/python" -m pip install --no-cache-dir poetry==1.8.5
          echo "$RUNNER_TEMP/poetry/bin" >> "$GITHUB_PATH"

      - name: Validate lockfile and install application and development dependencies
        run: |
          poetry check --lock
          python -m venv .venv
          poetry install --only main,dev --no-root
          poetry run python -m pip check

      - name: Lint Python
        run: poetry run ruff check .

      - name: Check Python formatting
        run: poetry run ruff format --check .

      - name: Check Python types
        run: poetry run mypy

      - name: Run all backend tests except marked slow tests without network sockets
        run: poetry run pytest -q -m "not slow" --disable-socket --allow-unix-socket
