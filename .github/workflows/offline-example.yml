name: Offline example

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-example-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: Standalone offline example
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Install standalone dependencies and pinned test tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r examples/requirements.txt
          .venv/bin/python -m pip install pytest==9.1.1 pytest-socket==0.8.1 pytest-timeout==2.4.0
          .venv/bin/python -m pip check

      - name: Verify the standalone CLI and exports without Python network sockets
        run: .venv/bin/python -m pytest -q tests/test_offline_example.py --disable-socket --allow-unix-socket --durations=5
