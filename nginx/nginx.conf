# nginx/nginx.conf — Production reverse proxy for the Investment Tool.
#
# Routes:
#   /api/*        → FastAPI backend (strips /api prefix)
#   /ws/*         → FastAPI WebSocket (upgrade)
#   /healthz      → FastAPI health check (passthrough)
#   /docs, /openapi.json → FastAPI Swagger (passthrough)
#   /*            → React SPA static files (with SPA fallback)
#
# HTTPS: Use with Certbot/Let's Encrypt or uncomment the SSL block below.

# The progress endpoint transports its bearer token in the query string.
# Keep access status/path evidence without query values or header contents.
log_format progress_safe '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent';

server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS so upstream hostnames are re-resolved after
    # container restarts instead of being cached at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # -- Security headers ---------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header X-XSS-Protection       "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # -- Health check (no auth, for load balancers) -------------------------
    location = /healthz {
        proxy_pass $api_upstream;
    }

    # -- API (strip /api prefix) --------------------------------------------
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass         $api_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # -- Swagger / OpenAPI (passthrough) ------------------------------------
    location /docs {
        proxy_pass $api_upstream;
    }
    location /openapi.json {
        proxy_pass $api_upstream;
    }

    # -- WebSocket ----------------------------------------------------------
    location /ws/ {
        access_log /var/log/nginx/access.log progress_safe;
        # Nginx error messages can include the raw request/upstream query.
        # Use the backend's query-redacted connection logs for this location.
        error_log /dev/null;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # -- Frontend static files (React SPA) ----------------------------------
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
