[tool.poetry]
name = "investment-tool-jgonzalez"
version = "0.1.0"
description = "Portfolio construction and strategy backtesting"
authors = ["Jesus Gonzalez"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{include = "investment_tool", from = "src"}, {include = "api", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11.5,<3.12"
pandas = "^2.1"
numpy = "^1.23.3"
pyomo = "^6.4.2"
plotly = "^5.23.0"
alpaca-py = "^0.44.0"
urllib3 = "^2.8.0"
python-dotenv = "^1.0.1"
alpha-vantage = "^3.0.0"
statsmodels = "^0.14.4"
cvxpy = "^1.5.3"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
pygad = "^3.3.1"
scikit-learn = "^1.5.2"
deap = "^1.4.1"
transformers = "^5.20.2"
# Local Docker deployments use CPU inference on both Intel/AMD and ARM Linux.
torch = [
    {version = "2.14.1+cpu", markers = "sys_platform == 'linux'", source = "pytorch-cpu"},
    {version = "2.14.1", markers = "sys_platform != 'linux'", source = "pypi"},
]
pymoo = "^0.6.1.5"
platypus-opt = "^1.4.1"
fastapi = "^0.143.0"
starlette = "^1.7.0"
uvicorn = {extras = ["standard"], version = "^0.34"}
pydantic = "^2.10"
sqlalchemy = "^2.0"
alembic = "^1.15"
psycopg2-binary = "^2.9"
redis = "^5.2"
celery = {extras = ["redis"], version = "^5.4"}
bcrypt = "^4.0"
PyJWT = {extras = ["crypto"], version = "^2.15.1"}
# Security floors for the HTTP parser chain; retain Multidict's existing major.
aiohttp = "^3.14.5"
multidict = "^6.9.1"
filelock = "^4.2.1"
cryptography = "^50.0.2"
# Remove compromised emSign trust; 2026.10.19 retains unaffected emSign roots.
certifi = "^2026.10.19"
# Security fixes for image decoding; Python >=3.11 fits this project's range.
pillow = "^13.0.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.5.4"
mypy = "^1.16.1"
pandas-stubs = "^2.2.3.250527"
pre-commit = "^4.2.0"
pytest = "^9.1.1"
pytest-cov = "^5.0.0"
pytest-timeout = "^2.3"
pytest-socket = "0.8.1"
httpx = "^0.28"
virtualenv = "^21.14.13"
# Security floor for the shared OSQP build dependency; TensorBoard is no longer used.
setuptools = "^84.1.0"

[tool.poetry.group.doc.dependencies]
mkdocs = "^1.6.0"
mkdocstrings = {extras = ["python"], version = "^0.25.2"}
mkdocs-material = "^9.7.7"
mkdocs-pdf-export-plugin = "^0.5.10"
weasyprint = "^70.0"
pygments = "^2.21.0"
soupsieve = "^2.10"
pymdown-extensions = "^11.0.2"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
mccabe = {max-complexity = 12}

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = ["src/investment_tool", "src/api", "tools/security/python_audit.py", "tools/security/python_regression.py"]
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = [
  "tests"
]
addopts = "-ra --timeout=30"
log_cli = false
markers = [
  "slow: explicitly marks expensive tests, including optimizer fixture setup — deselect with -m 'not slow'",
]
