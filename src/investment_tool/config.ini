[ALPHA-VANTAGE]
alpha_vantage_api_key=


[ALPACA]
alpaca_api_key=
alpaca_api_secret=
alpaca_base_url=https://paper-api.alpaca.markets/v2


[MODEL]
# Historical data window (YYYY-MM-DD)
historical_start_date=2020-01-01
# historical_end_date defaults to the current UTC date; set it to freeze a run.
# Portfolio and backtesting defaults
initial_cash=1000.0
min_backtest_periods=5
start_index_percentage_backtesting=0.5
transaction_cost_rate=0.001
# Effective annual rate used for reported excess-return metrics (not cash accrual).
risk_free_rate=0.0


[PATHS]
# Relative to project root unless absolute
input_data_dir=data/input


[DATABASE]
url=postgresql://investment_tool:investment_tool@localhost:5432/investment_tool


[REDIS]
url=redis://localhost:6379/0


[JWT]
secret_key=CHANGE-ME-IN-PRODUCTION
algorithm=HS256
access_token_expire_minutes=30
refresh_token_expire_minutes=10080
