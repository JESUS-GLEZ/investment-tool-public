# Alembic configuration for the Investment Tool API.
#
# The actual database URL is read from investment_tool.config at runtime
# (see migrations/env.py). Loading errors stop migrations; the placeholder
# below is not a fallback for an invalid application configuration.

[alembic]
script_location = migrations
prepend_sys_path = src

# Template used for new migration file names.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long revision identifiers to 12 chars.
truncate_slug_length = 40

# Default (overridden by env.py).
sqlalchemy.url = postgresql://investment_tool:investment_tool@localhost:5432/investment_tool

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
